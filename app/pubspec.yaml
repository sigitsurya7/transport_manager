name: transport_manager
description: "Transport Manager — tycoon logistik offline."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_scene: ^0.24.2
  vector_math: ^2.1.4
  path_provider: ^2.1.5
  sim_core:
    path: ../packages/sim_core
  persistence:
    path: ../packages/persistence

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/content/
    - assets/packs/
    - assets/models/
    - assets/models/thumbs/
